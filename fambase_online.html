<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamBase</title>
<style>
:root{color-scheme:dark;--bg:#06120d;--tx:#eafff4;--mut:#8fb5a2;--em:#1fbf7a;--emd:#0F5132;--am:#FFC107;--co:#FF4D4D;--gl:rgba(255,255,255,.07);--bd:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#0F5132 0,transparent 60%),radial-gradient(800px 500px at 100% 100%,#3a2c00 0,transparent 55%),var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
#lg{position:fixed;inset:0;z-index:50;background:#030a07;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .8s}
#lg.out{opacity:0;pointer-events:none}
#lg svg{width:150px;height:150px;cursor:pointer}
.rg{fill:none;stroke:#39ff88;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 340;filter:drop-shadow(0 0 6px #39ff88);transform-origin:50% 50%}
.go .rg{animation:sp 1.2s linear infinite}
.go .sh{animation:dis 1.3s forwards}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes dis{70%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.sh{fill:rgba(31,191,122,.12);stroke:#1fbf7a;stroke-width:2;transform-origin:50% 50%}
#lg p{color:var(--mut);margin:0;text-align:center;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 4px}
header h1{font-size:20px;margin:0}header small{color:var(--mut)}
nav{display:flex;gap:8px;padding:8px 16px}
nav button,.g{background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:9px 14px;backdrop-filter:blur(10px)}
nav button.on{background:var(--emd);border-color:var(--em)}
main{padding:8px 16px 90px;max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;height:160px;border-radius:24px;overflow:hidden;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(14px);cursor:pointer;--lc:rgba(31,191,122,.75)}
.card.low{--lc:rgba(255,77,77,.75);animation:pl 1.4s cubic-bezier(.68,-.55,.27,1.55) infinite alternate}
@keyframes pl{from{border-color:rgba(255,77,77,.3);box-shadow:0 0 0 rgba(255,77,77,0)}to{border-color:var(--co);box-shadow:0 0 22px rgba(255,77,77,.55)}}
.liq{position:absolute;inset:0;background:var(--lc);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.liq::before,.liq::after{content:"";position:absolute;left:50%;top:-16px;width:420px;height:420px;margin-left:-210px;border-radius:42%;background:var(--lc);animation:rot 7s linear infinite}
.liq::after{border-radius:40%;opacity:.5;animation-duration:11s;animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.ct{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.ct b{font-weight:600}.ct .v{font-size:26px;font-weight:700}.ct small{font-size:13px;opacity:.85;font-weight:400}
.pc{font-size:13px;opacity:.85}
.panel{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(14px)}
.ringw{position:relative;width:200px;height:200px;margin:4px auto}
.ringw svg{width:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray 1s,stroke-dashoffset 1s}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mid span{font-size:24px;font-weight:700;color:var(--am)}.mid small{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.li small{color:var(--mut)}
.pb{width:100%;background:linear-gradient(135deg,var(--emd),var(--em));border:0;border-radius:16px;padding:14px;font-weight:600;margin-top:10px}
.am{background:linear-gradient(135deg,#b88700,var(--am));color:#1a1300}
#sh{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#sh.on{display:flex}
.pn{width:100%;max-width:560px;background:#0b1f17;border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.pn h3{margin:0 0 8px}
input,select{width:100%;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:12px;padding:11px;margin:4px 0}
input[type=range]{padding:0;accent-color:#1fbf7a}
.big{font-size:54px;font-weight:800;text-align:center;color:var(--co)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--am);color:#1a1300;border:0;border-radius:20px;padding:14px 18px;font-weight:700;box-shadow:0 6px 24px rgba(255,193,7,.35)}
.ban{background:rgba(255,193,7,.14);border:1px solid var(--am);border-radius:16px;padding:12px;margin-bottom:12px}
.pt{position:fixed;z-index:60;pointer-events:none;border-radius:50%}
#tt{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:14px;z-index:70;display:none}
.hide{display:none}
.card:not(.low){--lc:var(--ic,rgba(31,191,122,.78))}
.ct{text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.4)}
.ej{position:absolute;right:12px;top:10px;font-style:normal;font-size:34px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.ch{flex:none;background:var(--gl);border:1px solid var(--bd);border-radius:999px;padding:7px 12px;white-space:nowrap}
.ch.on{background:var(--emd);border-color:var(--em)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 65%,transparent);background:color-mix(in srgb,var(--c) 20%,transparent);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;transition:transform .2s,box-shadow .2s}
.tl:hover,.tl:active{transform:scale(1.06);box-shadow:0 0 18px color-mix(in srgb,var(--c) 75%,transparent)}
.tl i{font-style:normal;font-size:30px;animation:bob 2.6s ease-in-out infinite}
.tl b{font-size:13px;font-weight:600;text-align:center}.tl small{color:var(--mut)}
.tl.dn{opacity:.4}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(14px)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
@media(prefers-reduced-motion:reduce){.liq::before,.liq::after,.card.low,.tl,.tl i,.ej{animation:none}}
</style></head><body>
<div id="lg"><svg viewBox="0 0 100 100" id="shield"><circle class="rg" cx="50" cy="50" r="46"/><path class="sh" d="M50 18 78 28v20c0 18-12 30-28 36C34 78 22 66 22 48V28z"/><path d="M40 50l8 8 14-16" fill="none" stroke="#39ff88" stroke-width="4" stroke-linecap="round"/></svg>
<p id="lm">Oila a’zosi sifatida kiring</p><div style="width:min(320px,86vw)"><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Parol" autocomplete="current-password"><button class="pb" id="lb">Kirish</button></div></div>
<header><div><h1>FamBase</h1><small id="mo"></small></div><small id="rl"></small></header>
<nav><button id="t1" class="on">Ombor</button><button id="t2">Xarajat</button></nav>
<main>
<section id="p1"><div id="bn"></div><div class="grid" id="grid"></div><p id="em" class="hide" style="color:var(--mut);text-align:center"></p>
<div id="ad" class="hide row"><button class="g" id="ai">+ Mahsulot</button><button class="g" id="rs">Oy boshi: Restock</button><button class="g" id="am">+ A’zo</button></div></section>
<section id="p2" class="hide"><div class="panel"><div class="ringw"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,.1)"/><circle id="c_food" cx="60" cy="60" r="52" stroke="#FFC107"/><circle id="c_communal" cx="60" cy="60" r="52" stroke="#1fbf7a"/><circle id="c_emergency" cx="60" cy="60" r="52" stroke="#FF4D4D"/></svg><div class="mid"><small>Qoldiq</small><span id="rem">0</span><small>so‘m</small></div></div><div id="cats"></div>
<button class="g hide" id="bb" style="width:100%;margin-top:10px">Byudjetni belgilash</button></div>
<div class="panel"><b>Bu oydagi xarajatlar</b><div id="xl"></div></div>
<button class="fab" id="ae">+ Xarajat</button></section>
</main>
<div id="sh"></div><div id="tt"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,setDoc,updateDoc,getDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyB-p1bBhzxzMEAjcHiWcVaD5_ObqNrmbVU",authDomain:"oila-a5972.firebaseapp.com",projectId:"oila-a5972",storageBucket:"oila-a5972.firebasestorage.app",messagingSenderId:"718270422985",appId:"1:718270422985:web:14ce1a1513ef259cb31218"});
const auth=getAuth(app),F=getFirestore(app);
const fdb={collection:p=>{const c=collection(F,p);return{onSnapshot:cb=>onSnapshot(c,s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))})),add:o=>addDoc(c,o)}},doc:p=>{const r=doc(F,p);return{onSnapshot:cb=>onSnapshot(r,s=>cb({exists:s.exists(),data:()=>s.data()})),update:o=>updateDoc(r,o),set:o=>setDoc(r,o)}}};
const $=s=>document.querySelector(s),C=['food','communal','emergency'],CN={food:'Oziq-ovqat',communal:'Kommunal',emergency:'Ehtiyoj'},CC={food:'#FFC107',communal:'#1fbf7a',emergency:'#FF4D4D'};
let db,user,uid='',admin=false,items=[],logs=[],exps=[],bud={};
const mk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fm=n=>Math.round(n).toLocaleString('ru-RU');
const hexA=(h,a=.8)=>{const n=parseInt((h||'#1fbf7a').slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const used=it=>logs.filter(l=>l.item===it.id&&l.epoch===(it.epoch||0)).reduce((a,l)=>a+l.amount,0);
const stock=it=>Math.max(0,it.initial-used(it));
const lv=r=>`translateY(calc(${(1-r)*100}% + ${(1-r)*20}px))`;
function toast(m){const t=$('#tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function tick(el,to,dec=2){const from=el._v??0;el._v=to;const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);const v=from+(to-from)*e;el.textContent=dec?v.toFixed(dec):fm(v);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function sheet(h){const s=$('#sh');s.innerHTML='<div class="pn">'+h+'</div>';s.classList.add('on');s.onclick=e=>{if(e.target===s)closeS()}}
function closeS(){$('#sh').classList.remove('on')}
function fx(x,y,col,n,up){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='pt';const s=3+Math.random()*5;p.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${col};box-shadow:0 0 8px ${col}`;document.body.appendChild(p);const a=Math.random()*6.28,d=30+Math.random()*60;const dx=up?(Math.random()-.5)*60:Math.cos(a)*d,dy=up?-(40+Math.random()*90):Math.sin(a)*d-30;p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px)`,opacity:0}],{duration:900+Math.random()*600,easing:'ease-out'}).onfinish=()=>p.remove()}}
function melt(c,v){const r=c.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;fx(x,y,'#ff8a8a',26,false);const t=document.createElement('div');t.className='pt';t.style.cssText=`left:${x-30}px;top:${y-14}px;font-size:28px;font-weight:800;color:#ff8a8a;border-radius:0`;t.textContent='−'+v;document.body.appendChild(t);t.animate([{opacity:1,transform:'translateY(0)',filter:'blur(0)'},{opacity:0,transform:'translateY(-50px)',filter:'blur(6px)'}],{duration:1100}).onfinish=()=>t.remove()}
function refill(c,r){const l=c.querySelector('.liq');l.style.transition='none';l.style.transform=lv(0);void l.offsetWidth;l.style.transition='';const i=[...$('#grid').children].indexOf(c);setTimeout(()=>{l.style.transform=lv(r);const b=c.getBoundingClientRect();fx(b.left+b.width/2,b.bottom-20,'#FFC107',14,true)},i*130)}
function renderCards(){const g=$('#grid'),ids=new Set(items.map(i=>i.id));
[...g.children].forEach(c=>{if(!ids.has(c.dataset.id))c.remove()});
items.forEach(it=>{let c=g.querySelector(`[data-id="${it.id}"]`);
if(!c){c=document.createElement('div');c.className='card';c.dataset.id=it.id;c.innerHTML='<div class="liq"></div><i class="ej"></i><div class="ct"><b></b><div class="v"><span>0.00</span> <small></small></div><div class="pc"></div></div>';c.onclick=()=>openConsume(items.find(x=>x.id===it.id));c._ep=it.epoch||0;c.querySelector('.liq').style.transform=lv(0);g.appendChild(c)}
const cur=stock(it),r=it.initial?Math.min(1,cur/it.initial):0;
c.querySelector('b').textContent=it.name;c.querySelector('.ej').textContent=it.emoji||'';c.style.setProperty('--ic',hexA(it.color));c.querySelector('small').textContent=it.unit;c.querySelector('.pc').textContent=Math.round(r*100)+'% · '+it.initial+' '+it.unit+' dan';
tick(c.querySelector('.v span'),cur);c.classList.toggle('low',cur<=it.initial*.2);
if((it.epoch||0)!==c._ep){c._ep=it.epoch||0;refill(c,r)}else{void c.offsetWidth;c.querySelector('.liq').style.transform=lv(r)}});
$('#em').classList.toggle('hide',items.length>0);$('#em').textContent=admin?'Hali mahsulot yo‘q. “+ Mahsulot” tugmasi bilan qo‘shing.':'Admin mahsulotlarni qo‘shishini kuting.';
$('#bn').innerHTML=admin&&items.some(i=>i.month!==mk())?'<div class="ban">Yangi oy boshlandi. Oylik zaxirani kiriting: “Oy boshi: Restock”.</div>':''}
function renderBud(){const m=mk(),sp={food:0,communal:0,emergency:0};const ml=exps.filter(e=>e.month===m);ml.forEach(e=>sp[e.cat]+=e.amount);
const tot=C.reduce((a,k)=>a+(bud[k]||0),0),spent=C.reduce((a,k)=>a+sp[k],0),L=326.7;let off=0;
C.forEach(k=>{const len=tot?Math.min(L,sp[k]/tot*L):0,c=$('#c_'+k);c.style.strokeDasharray=`${len} ${L-len}`;c.style.strokeDashoffset=-off;off+=len});
tick($('#rem'),tot-spent,0);
$('#cats').innerHTML=C.map(k=>`<div class="row"><span><i class="dot" style="background:${CC[k]}"></i>${CN[k]}</span><small>${fm((bud[k]||0)-sp[k])} / ${fm(bud[k]||0)}</small></div>`).join('');
$('#xl').innerHTML=ml.sort((a,b)=>b.at-a.at).slice(0,20).map(e=>`<div class="li"><span>${esc(e.title)}<br><small>${CN[e.cat]||''} · ${new Date(e.at).toLocaleDateString('uz')}</small></span><b>−${fm(e.amount)}</b></div>`).join('')||'<p style="color:var(--mut)">Hozircha xarajat yo‘q</p>'}
function openConsume(it){if(!it)return;const cur=stock(it);sheet(`<h3>${esc(it.name)}</h3><small style="color:var(--mut)">Qoldiq: ${cur.toFixed(2)} ${esc(it.unit)}</small><div class="big"><span id="bv">0.00</span></div><input type="range" id="rg" min="0" max="${cur}" step="0.05" value="0"><div class="row"><button class="g" id="m">−0.25</button><button class="g" id="p">+0.25</button></div><button class="pb" id="ok">Tasdiqlash</button>`);
const rg=$('#rg'),sv=()=>$('#bv').textContent=(+rg.value).toFixed(2);rg.oninput=sv;
$('#m').onclick=()=>{rg.value=Math.max(0,+rg.value-.25);sv()};$('#p').onclick=()=>{rg.value=Math.min(cur,+rg.value+.25);sv()};
$('#ok').onclick=async()=>{const v=+(+rg.value).toFixed(2);if(!v)return;const c=document.querySelector(`[data-id="${it.id}"]`);closeS();melt(c,v);try{await db.collection('logs').add({item:it.id,epoch:it.epoch||0,amount:v,by:uid,month:mk(),at:Date.now()})}catch(e){toast('Yozib bo‘lmadi: ruxsat yo‘q')}}}
function custom(){sheet(`<h3>Yangi mahsulot</h3><input type="color" id="cl" value="#1fbf7a" style="height:44px"><input id="n" placeholder="Nomi (masalan, sabzi)"><select id="u"><option>kg</option><option>dona</option><option>litr</option></select><input id="q" type="number" step="0.01" placeholder="Oylik zaxira"><button class="pb" id="ok">Qo‘shish</button>`);
$('#ok').onclick=async()=>{const n=$('#n').value.trim(),q=+$('#q').value;if(!n||!(q>0))return;try{await db.collection('items').add({name:n,unit:$('#u').value,color:$('#cl').value,emoji:'🛒',initial:q,epoch:0,month:mk()});closeS()}catch(e){toast('Faqat admin qo‘sha oladi')}}};
const CAT=[['Sabzavotlar','🥬',`Sabzi|kg|#FF8C1A|🥕;Piyoz|kg|#D9A441|🧅;Kartoshka|kg|#C9A66B|🥔;Pomidor|kg|#E53935|🍅;Bodring|kg|#4CAF50|🥒;Baqlajon|kg|#6A1B9A|🍆;Bulg‘or qalampiri|kg|#FBC02D|🫑;Achchiq qalampir|kg|#D32F2F|🌶️;Sarimsoqpiyoz|kg|#E8E2CC|🧄;Oq boshli karam|kg|#9CCC65|🥬;Gulkaram|kg|#F1EFD8|🥦;Brokkoli|kg|#2E7D32|🥦;Lavlagi|kg|#AD1457|🟣;Turp|kg|#F48FB1|🌱;Sholg‘om|kg|#CE93D8|🌱;Qovoq|kg|#FF9800|🎃;Oshqovoq|kg|#A5D6A7|🥒;Ismaloq|kg|#2E7D32|🥬;Makkajo‘xori|dona|#FDD835|🌽;Ko‘k no‘xat|kg|#7CB342|🫛;Qo‘ziqorin|kg|#BCAAA4|🍄`],['Ko‘katlar','🌿',`Petrushka|bog‘|#43A047|🌿;Shivit|bog‘|#66BB6A|🌿;Kashnich|bog‘|#388E3C|🌿;Rayhon|bog‘|#2E7D32|🌿;Yalpiz|bog‘|#26A69A|🌿;Ko‘k piyoz|bog‘|#7CB342|🌱;Salat bargi|bog‘|#8BC34A|🥬;Jambil|bog‘|#558B2F|🌿`],['Mevalar','🍎',`Olma|kg|#E53935|🍎;Nok|kg|#C0CA33|🍐;Banan|kg|#FDD835|🍌;Uzum|kg|#7B1FA2|🍇;Anor|kg|#B71C1C|🔴;Limon|kg|#FFEB3B|🍋;Apelsin|kg|#FB8C00|🍊;Mandarin|kg|#FF9800|🍊;Behi|kg|#D4B106|🍐;Shaftoli|kg|#FFAB91|🍑;O‘rik|kg|#FFB74D|🍑;Olxo‘ri|kg|#5E35B1|🫐;Gilos|kg|#C2185B|🍒;Tarvuz|kg|#EF5350|🍉;Qovun|kg|#FFE082|🍈;Qulupnay|kg|#E53935|🍓;Kivi|kg|#8BC34A|🥝;Ananas|dona|#FBC02D|🍍`],['Don va dukkaklilar','🌾',`Guruch|kg|#F5F0DC|🍚;Mosh|kg|#7CB342|🫘;Nohut|kg|#E0B96A|🫘;Oq loviya|kg|#E8DCC0|🫘;Qizil loviya|kg|#B71C1C|🫘;Yasmiq|kg|#E65100|🫘;Grechka yormasi|kg|#8D6E63|🌾;Bug‘doy uni|kg|#F5E6C8|🌾;Makaron|kg|#FFD54F|🍝;Vermishel|kg|#FFE082|🍜;Suli yormasi|kg|#D7CCC8|🌾;Manka yormasi|kg|#FFF3C4|🌾;Arpa yormasi|kg|#BCAAA4|🌾;Makkajo‘xori yormasi|kg|#FFD740|🌽`],['Choy va shirinliklar','🍵',`Qora choy|kg|#4E342E|🍵;Ko‘k choy|kg|#689F38|🍵;Mevali choy|quti|#AD1457|🫖;Qahva|kg|#5D4037|☕;Shakar|kg|#FFFFFF|🍬;Asal|kg|#F9A825|🍯;Murabbo|bank|#C62828|🫙;Pechenye|kg|#D7A86E|🍪;Konfet|kg|#EC407A|🍬;Shokolad|dona|#5D4037|🍫;Holva|kg|#C69C6D|🍰;Novvot|kg|#FFE082|🍬;Parvarda|kg|#F5CBA7|🍬;Mayiz|kg|#8D6E63|🍇;Quritilgan o‘rik|kg|#FF8F00|🍑;Yong‘oq|kg|#A1887F|🌰;Bodom|kg|#D7B98E|🥜;Pista|kg|#9CCC65|🥜;Tort|dona|#F8BBD0|🎂;Vafli|dona|#E0A96D|🧇;Muzqaymoq|dona|#F8BBD0|🍦`],['Go‘sht va sut','🥩',`Mol go‘shti|kg|#C62828|🥩;Qo‘y go‘shti|kg|#E57373|🍖;Tovuq go‘shti|kg|#FFCC80|🍗;Baliq|kg|#4FC3F7|🐟;Kolbasa|kg|#E57373|🌭;Tuxum|dona|#F5E6C8|🥚;Sut|litr|#F5F5F5|🥛;Qatiq|litr|#EEEEEE|🥛;Qaymoq|kg|#FFF8E1|🥛;Sariyog‘|kg|#FFE082|🧈;Pishloq|kg|#FFC107|🧀;Suzma|kg|#F5F5DC|🥣;Kefir|litr|#E3F2FD|🥛;Non|dona|#D9A55B|🍞`],['Yog‘ va ziravorlar','🧂',`Kungaboqar yog‘i|litr|#FFD54F|🫒;Zaytun yog‘i|litr|#9E9D24|🫒;Tuz|kg|#ECEFF1|🧂;Qora murch|kg|#37474F|⚫;Zira|kg|#8D6E63|🌿;Zarchava|kg|#F9A825|🟡;Qizil qalampir|kg|#D32F2F|🌶️;Dolchin|kg|#8D4E2D|🌿;Dafna bargi|pachka|#558B2F|🍃;Sirka|litr|#FFE0B2|🍶;Tomat pastasi|bank|#E53935|🥫;Mayonez|dona|#FFF59D|🥫;Ketchup|dona|#D32F2F|🥫;Soya sousi|dona|#3E2723|🍶;Vanilin|dona|#FFF3E0|🌼;Xamirturush|pachka|#FFE0B2|🍞`],['Ichimliklar','🥤',`Ichimlik suvi|litr|#4FC3F7|💧;Mineral suv|litr|#80DEEA|💧;Sharbat|litr|#FF9800|🧃;Gazli ichimlik|litr|#FF7043|🥤;Kompot|litr|#C2185B|🫙`],['Maishiy buyumlar','🧼',`Kir yuvish kukuni|kg|#42A5F5|🧺;Idish yuvish vositasi|dona|#26C6DA|🧽;Hojatxona qog‘ozi|dona|#E0F2F1|🧻;Sovun|dona|#F8BBD0|🧼;Shampun|dona|#7E57C2|🧴;Tish pastasi|dona|#26A69A|🪥;Salfetka|pachka|#FFCCBC|🧻;Chiqindi paketi|rulon|#37474F|🗑️`]];
let cs=0;const JA=new Set();
function catalog(){const added=new Set([...items.map(i=>i.name),...JA]);
sheet(`<h3>Mahsulotlar ro‘yxati</h3><div class="chips">${CAT.map((c,i)=>`<button class="ch${i===cs?' on':''}" data-s="${i}">${c[1]} ${c[0]}</button>`).join('')}<button class="ch" id="cu">✏️ Boshqa</button></div><div class="tg">${CAT[cs][2].split(';').map((r,i)=>{const[n,u,col,e]=r.split('|'),d=added.has(n);return `<button class="tl${d?' dn':''}" style="--c:${col};animation-delay:${i*30}ms" data-n="${n}" data-u="${u}" data-c="${col}" data-e="${e}"><i>${e}</i><b>${n}</b><small>${u}${d?' ✓':''}</small></button>`}).join('')}</div><div id="ad2"></div>`);
document.querySelectorAll('.ch[data-s]').forEach(b=>b.onclick=()=>{cs=+b.dataset.s;catalog()});$('#cu').onclick=custom;
document.querySelectorAll('.tl').forEach(t=>t.onclick=()=>{if(t.classList.contains('dn'))return;const{n,u,c,e}=t.dataset;$('#ad2').innerHTML=`<div class="row" style="margin-top:12px"><span>${e} ${n}</span><input id="q" type="number" step="0.01" placeholder="Zaxira, ${u}" style="width:130px"><button class="g" id="ok2" style="background:${hexA(c,.35)}">Qo‘shish</button></div>`;$('#q').focus();
$('#ok2').onclick=async()=>{const q=+$('#q').value;if(!(q>0))return;try{await db.collection('items').add({name:n,unit:u,color:c,emoji:e,initial:q,epoch:0,month:mk()});JA.add(n);toast(n+' qo‘shildi');catalog()}catch(x){toast('Faqat admin qo‘sha oladi')}}})}
$('#ai').onclick=catalog;
$('#rs').onclick=()=>{if(!items.length)return;sheet(`<h3>Oy boshi: yangi zaxira</h3><div class="row"><label><input type="radio" name="md" value="acc" checked style="width:auto"> Qoldiqni qo‘shish</label><label><input type="radio" name="md" value="hard" style="width:auto"> Nolga tushirish</label></div>`+items.map(i=>`<div class="row"><span>${esc(i.name)} <small>(qoldiq ${stock(i).toFixed(2)})</small></span><input type="number" step="0.01" data-i="${i.id}" placeholder="${esc(i.unit)}" style="width:110px"></div>`).join('')+`<button class="pb am" id="ok">Zaxirani yangilash</button>`);
$('#ok').onclick=async()=>{const acc=document.querySelector('[name=md]:checked').value==='acc';closeS();try{for(const it of items){const v=+(document.querySelector(`[data-i="${it.id}"]`).value||0);const nx=acc?stock(it)+v:v;await db.doc('items/'+it.id).update({initial:+nx.toFixed(2),epoch:(it.epoch||0)+1,month:mk()})}}catch(e){toast('Faqat admin restock qila oladi')}}};
$('#ae').onclick=()=>{sheet(`<h3>Yangi xarajat</h3><select id="c">${C.map(k=>`<option value="${k}">${CN[k]}</option>`).join('')}</select><input id="t" placeholder="Nima uchun?"><input id="a" type="number" placeholder="Summa (so‘m)"><button class="pb am" id="ok">Saqlash</button>`);
$('#ok').onclick=async()=>{const t=$('#t').value.trim(),a=+$('#a').value;if(!t||!(a>0))return;closeS();try{await db.collection('expenses').add({cat:$('#c').value,title:t,amount:a,by:uid,month:mk(),at:Date.now()})}catch(e){toast('Yozib bo‘lmadi')}}};
$('#bb').onclick=()=>{sheet(`<h3>Oylik byudjet</h3>`+C.map(k=>`<div>${CN[k]}<input type="number" id="b_${k}" value="${bud[k]||''}" placeholder="so‘m"></div>`).join('')+`<button class="pb" id="ok">Saqlash</button>`);
$('#ok').onclick=async()=>{const o={};C.forEach(k=>o[k]=+$('#b_'+k).value||0);closeS();try{await db.doc('cfg/budget').set(o)}catch(e){toast('Faqat admin')}}};
function tab(n){$('#p1').classList.toggle('hide',n!==1);$('#p2').classList.toggle('hide',n!==2);$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2)}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
let started=false;const msg=t=>$('#lm').textContent=t;
$('#lb').onclick=async()=>{msg('Tekshirilmoqda…');$('#lg').classList.add('go');try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}catch(e){$('#lg').classList.remove('go');msg('Email yoki parol noto‘g‘ri')}};
$('#rl').onclick=()=>signOut(auth).then(()=>location.reload());
$('#am').onclick=()=>{sheet(`<h3>Yangi a’zo</h3><small style="color:var(--mut)">Avval Firebase Authentication’da shu email bilan foydalanuvchi yarating.</small><input id="me" type="email" placeholder="Email"><button class="pb" id="ok">Qo‘shish</button>`);$('#ok').onclick=async()=>{const e=$('#me').value.trim().toLowerCase();if(!e)return;try{await fdb.doc('members/'+e).set({role:'member'});closeS();toast('A’zo qo‘shildi')}catch(x){toast('Faqat admin')}}};
onAuthStateChanged(auth,async u=>{if(!u||started)return;let m;try{m=await getDoc(doc(F,'members',u.email.toLowerCase()))}catch(e){}
if(!m||!m.exists()){msg('Ruxsat yo‘q: siz ro‘yxatda emassiz');$('#lg').classList.remove('go');signOut(auth);return}
started=true;db=fdb;uid=u.uid;admin=m.data().role==='admin';$('#lg').classList.add('go');$('#rl').textContent=(admin?'Admin':'A’zo')+' · chiqish';
$('#ad').classList.toggle('hide',!admin);$('#bb').classList.toggle('hide',!admin);
$('#mo').textContent=new Date().toLocaleDateString('uz',{month:'long',year:'numeric'});
db.collection('items').onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));renderCards()});
db.collection('logs').onSnapshot(s=>{logs=s.docs.map(d=>d.data());renderCards()});
db.collection('expenses').onSnapshot(s=>{exps=s.docs.map(d=>d.data());renderBud()});
db.doc('cfg/budget').onSnapshot(d=>{bud=d.exists?d.data():{};renderBud()});
setTimeout(()=>$('#lg').classList.add('out'),1300)});
</script></body></html>
